<div class="card">
  <div class="user-bg">
    <div class="card-body">
      <form *ngIf="formSearch" [formGroup]="formSearch" (ngSubmit)="getData()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="tenSanPham" class="form-label">Tên Sản phẩm</label>
            <input
              type="text"
              class="form-control"
              formControlName="tenSanPham"
              placeholder="Tên Sản phẩm"
              required
            />
          </div>

          <div class="col-md-6 mb-3">
            <label for="gia" class="form-label">Giá</label>
            <input-moneny type="text" formControlName="gia" />
          </div>
        </div>

        <div class="list-button">
          <button
            nz-button
            type="button"
            class="btn btn-primary btn-search"
            (click)="getData()"
          >
            <i nz-icon nzType="search" nzTheme="outline"></i>Tìm kiếm
          </button>

          <button
            nz-button
            type="button"
            class="btn btn-primary btn-search"
            (click)="onReset()"
          >
            <i nz-icon nzType="reload" nzTheme="outline"></i>Làm mới
          </button>
        </div>
      </form>
    </div>

    <div class="mb-4">
      <div class="data-table">
        <div class="hearder-table mt-m-15">
          <nz-tabset (nzSelectedIndexChange)="changeTab($event)">
            <nz-tab nzTitle="Danh sách dữ liệu"> </nz-tab>
          </nz-tabset>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-bordered table-hover">
              <thead>
                <tr>
                  <th class="text-center">Tên sản phẩm</th>
                  <th class="text-center">Giá</th>
                  <td class="text-center">Giảm giá</td>
                  <th class="text-center">Giá sau giảm</th>
                  <th class="text-center">Số tồn kho</th>
                  <th class="text-center">Hành động</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of listOfData">
                  <td class="text-center">{{ item.tenSanPham }}</td>
                  <td class="text-center">{{ item.gia | moneyPipe }}</td>
                  <td class="text-center">
                    {{ item.giamGia | labelValue: listGiamGia }}
                  </td>
                  <td class="text-center">{{ item.giaSauGiam | moneyPipe }}</td>
                  <td class="text-center">{{ item.soTonKho }}</td>
                  <td class="text-center">
                    <button class="btn" (click)="addToCart(item)">
                      <i class="fa-solid fa-circle-plus"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="list-button mt-4">
  <button
    nz-button
    type="button"
    class="btn btn-danger"
    (click)="closeDialogcd()"
  >
    <i class="isax-close-circle1 mr-2"></i>Đóng
  </button>
</div>
