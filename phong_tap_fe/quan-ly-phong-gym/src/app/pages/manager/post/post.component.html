<div
  class="list-button page-header d-flex flex-wrap justify-content-between align-items-center p-md-4"
>
  <h1 class="mb-0 fw-bold d-flex align-items-center">
    <i class="bi bi-cart3 text-primary"></i>
    Quản lý bài đăng
  </h1>
</div>

<div class="card filter-card mb-4">
  <div class="card-body p-3 p-md-4">
    <h6 class="fw-semibold text-secondary mb-3 d-flex align-items-center gap-2">
      <i class="fa-solid fa-filter"></i>

      Bộ lọc tìm kiếm
    </h6>

    <div class="row g-3 mb-3">
      <form *ngIf="formSearch" [formGroup]="formSearch" (ngSubmit)="getData()">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="tenNguoiDung" class="form-label">Tên Nhân viên</label>
            <input
              type="text"
              class="form-control"
              formControlName="tenNguoiDung"
              placeholder="Tên Nhân viên"
            />
          </div>

          <div class="col-md-4 mb-3">
            <label for="tenBaiViet" class="form-label">Tên bài viết</label>
            <input
              type="text"
              class="form-control"
              formControlName="tenBaiViet"
              placeholder="Tên bài viết"
            />
          </div>

          <div class="col-md-4 mb-3">
            <label for="ngayDangBai" class="form-label">Ngày đăng bài</label>
            <input-date type="text" formControlName="ngayDangBai" />
          </div>

          <div class="col-md-4 mb-3">
            <label for="ngayCapNhat" class="form-label">Ngày cập nhật</label>
            <input-date type="text" formControlName="ngayCapNhat" />
          </div>
        </div>

        <div class="list-button">
          <button
            nz-button
            type="button"
            class="btn btn-primary btn-search"
            (click)="getData()"
          >
            <i nz-icon nzType="search" nzTheme="outline"></i>Tìm kiếm
          </button>

          <button
            nz-button
            type="button"
            class="btn btn-primary btn-search"
            (click)="onReset()"
          >
            <i nz-icon nzType="reload" nzTheme="outline"></i>Làm mới
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="card">
  <div class="user-bg">
    <div class="mb-4">
      <div
        class="card-header bg-white border-bottom d-flex flex-wrap justify-content-between align-items-center py-3 px-3 px-md-4"
      >
        <h6 class="mb-0 fw-semibold">Danh sách bài đăng</h6>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead>
            <tr>
              <th class="text-center">Tên người dùng</th>
              <th class="text-center">Tên bài viết</th>
              <th class="text-center">Ngày đăng bài</th>
              <td class="text-center">Ngày cập nhật</td>
              <th class="text-center">Hành động</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of listOfData">
              <td class="text-center">{{ item.tenNguoiDung }}</td>
              <td class="text-center">{{ item.tenBaiViet }}</td>
              <td class="text-center">{{ item.ngayDangBai | dateFormat }}</td>
              <td class="text-center">{{ item.ngayCapNhat | dateFormat }}</td>
              <td class="text-center">
                <div class="actions">
                  <button
                    class="btn-icon view"
                    (click)="handlerOpenDialog(item, 'view')"
                  >
                    <i class="fa-solid fa-eye"></i>
                  </button>

                  <button
                    class="btn-icon edit"
                    (click)="handlerOpenDialog(item, 'edit')"
                  >
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button class="btn-icon delete" (click)="deleteData(item.id)">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
