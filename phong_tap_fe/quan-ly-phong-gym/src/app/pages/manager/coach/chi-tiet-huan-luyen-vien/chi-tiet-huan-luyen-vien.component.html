<nz-tabset class="popup-layout">
  <nz-tab class="title-layout" nzTitle="Thông tin">
    <ng-container *ngIf="!initForm">
      <nz-skeleton [nzParagraph]="{ rows: 10 }"></nz-skeleton>
    </ng-container>
    <ng-template nz-tab *ngTemplateOutlet="tab1"></ng-template>
  </nz-tab>
</nz-tabset>

<ng-template #tab1>
  <ng-container *ngIf="initForm">
    <form *ngIf="myForm" [formGroup]="myForm" (ngSubmit)="saveData()">
      <div class="bg-display-flex">
        <!-- CÁC TRƯỜNG THÔNG TIN -->
        <div class="row">
          <div class="col-md-7">
            <label for="tenKhachHang" class="form-label">Tên khách hàng</label>
            <input
              type="text"
              class="form-control"
              formControlName="tenKhachHang"
              placeholder="Tên khách hàng"
            />
          </div>

          <div class="col-md-2 layout-chon">
            <button
            *ngIf="this.mode !== 'view'"
              type="button"
              class="form-control btn-primary"
              (click)="chonKhachHang()"
            >
              Chọn khách hàng
            </button>
          </div>

          <div class="col-md-3 layout-chon">
            <button
              *ngIf="this.mode !== 'view'"
              type="button"
              class="form-control btn-primary"
              (click)="chonHuanLuyenVien()"
            >
              Chọn huấn luyện viên
            </button>
          </div>

          <div class="col-md-6">
            <label for="soDienThoai" class="form-label">Số điện thoại</label>
            <input
              type="text"
              class="form-control"
              formControlName="soDienThoai"
              placeholder="Số điện thoại"
            />
          </div>

          <div class="col-md-6">
            <label for="idGoiTap" class="form-label">Huấn luyện viên</label>
            <input
              type="text"
              class="form-control"
              formControlName="tenNguoiDung"
              placeholder="Huấn luyện viên"
            />
          </div>

          <div class="col-md-6">
            <label for="idGoiTap" class="form-label">Gói tập</label>
            <input
              type="text"
              class="form-control"
              formControlName="tenGoiTap"
              placeholder="Gói tập"
            />
          </div>

          <div class="col-md-6">
            <label for="idGoiTap" class="form-label">Chức vụ</label>
            <input-select
              formControlName="vaiTro"
              placeholder="Vai trò"
              [items]="listVaiTro"
            />
          </div>

          <div class="col-md-6">
            <label for="idGoiTap" class="form-label"
              >Số điện thoại huấn luyện viên</label
            >
            <input
              type="text"
              class="form-control"
              formControlName="soDienThoaiHLV"
              placeholder="Số điện thoại"
            />
          </div>

          <div class="col-md-6">
            <label for="idGoiTap" class="form-label"
              >Email huấn luyện viên</label
            >
            <input
              type="email"
              class="form-control"
              formControlName="emailHLV"
              placeholder="Email"
            />
          </div>
        </div>
      </div>
    </form>
  </ng-container>
</ng-template>

<div class="list-button mt-4">
  <button
    nz-button
    type="button"
    class="btn btn-danger"
    (click)="closeDialog()"
  >
    <i class="isax-close-circle1 mr-2"></i>Đóng
  </button>

  <ng-container *ngIf="initForm">
    <button
      nz-button
      type="button"
      class="btn btn-primary"
      (click)="saveData()"
    >
      <i class="isax-add-circle1 mr-2"></i>Ghi
    </button>
  </ng-container>
</div>
