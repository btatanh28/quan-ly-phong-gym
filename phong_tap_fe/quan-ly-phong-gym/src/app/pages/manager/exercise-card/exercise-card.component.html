<div
  class="list-button page-header d-flex flex-wrap justify-content-between align-items-center p-md-4"
>
  <h1 class="mb-0 fw-bold d-flex align-items-center">
    <i class="bi bi-cart3 text-primary"></i>
    Quản lý thẻ tập
  </h1>
</div>

<div class="card filter-card mb-4">
  <div class="card-body p-3 p-md-4">
    <h6 class="fw-semibold text-secondary mb-3 d-flex align-items-center gap-2">
      <i class="fa-solid fa-filter"></i>

      Bộ lọc tìm kiếm
    </h6>

    <div class="row g-3 mb-3">
      <form *ngIf="formSearch" [formGroup]="formSearch" (ngSubmit)="getData()">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="tenGoiTap" class="form-label">Tên khách hàng</label>
            <input
              type="text"
              class="form-control"
              formControlName="tenKhachHang"
              placeholder="Tên khách hàng"
              required
            />
          </div>

          <div class="col-md-4 mb-3">
            <label for="gia" class="form-label">Số điện thoại</label>
            <input
              type="text"
              class="form-control"
              formControlName="soDienThoai"
              placeholder="Số điện thoại"
              required
            />
          </div>

          <div class="col-md-4 mb-3">
            <label for="gia" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="Email"
              required
            />
          </div>
        </div>

        <div class="list-button">
          <button
            nz-button
            type="button"
            class="btn btn-primary btn-search"
            (click)="getData()"
          >
            <i nz-icon nzType="search" nzTheme="outline"></i>Tìm kiếm
          </button>

          <button
            nz-button
            type="button"
            class="btn btn-primary btn-search"
            (click)="onReset()"
          >
            <i nz-icon nzType="reload" nzTheme="outline"></i>Làm mới
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="card">
  <div class="user-bg">
    <div class="mb-4">
      <div
        class="card-header bg-white border-bottom d-flex flex-wrap justify-content-between align-items-center py-3 px-3 px-md-4"
      >
        <h6 class="mb-0 fw-semibold">Danh sách đơn hàng</h6>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead>
            <tr>
              <th class="text-center">Tên khách hàng</th>
              <th class="text-center">Số điện thoại</th>
              <th class="text-center">Email</th>
              <th class="text-center">Số ngày còn lại</th>
              <th class="text-center">Hành động</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of listOfData">
              <td class="customer-name text-center">
                {{ item.tenKhachHang }}
              </td>
              <td class="text-center">{{ item.soDienThoai }}</td>
              <td class="text-center">{{ item.email }}</td>
              <td class="text-center">
                @if (item.soNgayConLai > 3) {
                  <span class="date-exercise">
                    {{ item.soNgayConLai }}
                  </span>
                } @else {
                  <span class="date-exercise-warning">
                    {{ item.soNgayConLai }}
                  </span>
                }
              </td>
              <td class="text-center">
                <div class="actions">
                  <button class="btn-icon delete" (click)="deleteData(item.id)">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
