spring.application.name=QuanLyPhongGym

# ================= DATABASE =================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# =================SEND MAIL =================
sendgrid.api.key=${SENDGRID_API_KEY}
email.from=${EMAIL_FROM}



# =================SPRING MAIL =================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}

spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}



# ================= SMS =================

# ================= MOMO PAYMENT =================
## DEV ENV


momo.endpoint=${MOMO_ENDPOINT}
momo.accessKey=${MOMO_ACCESS_KEY}
momo.secretKey=${MOMO_PARTNER_CODE}
momo.partnerCode=${MOMO_SECRET_KEY}

momo.redirectUrl=${MOMO_REDIRECT_URL}
momo.ipnUrl=${MOMO_IPN_URL}


# ================= VNPAY PAYMENT =================
## Sandbox

## Callback

vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl=${VNPAY_PAYURL}
vnpay.returnUrl=${VNPAY_RETURN_URL}
vnpay.ipnUrl=${VNPAY_IPNURL}
vnpay.apiUrl=${VNPAY_APIURL}

## Version
vnpay.version=2.1.0
vnpay.command=pay
vnpay.currCode=VND
vnpay.locale=vn
vnpay.orderType=other

# ================= GEMINI/GROQ =================
groq.api-key=${GROQ_API_KEY}

# ================= SERVER =================
server.port=${PORT:8080}
