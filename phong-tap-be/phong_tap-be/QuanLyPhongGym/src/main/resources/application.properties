spring.application.name=QuanLyPhongGym

# ================= DATABASE =================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}




spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ================= MAIL =================
sendgrid.api.key=${SENDGRID_API_KEY}
email.from=${EMAIL_FROM}


spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}

spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}




spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================= SMS =================



# ================= MOMO PAYMENT =================
## DEV ENV


## PROD ENV


## API PATH
CREATE_URL=/create
QUERY_URL=/query
REFUND_URL=/refund
CONFIRM_URL=/confirm
TOKEN_PAY_URL=/tokenization/pay
TOKEN_BIND_URL=/tokenization/bind
TOKEN_INQUIRY_URL=/tokenization/cbQuery
TOKEN_DELETE_URL=/tokenization/delete

momo.endpoint=${MOMO_ENDPOINT}
momo.accessKey=${MOMO_ACCESS_KEY}
momo.secretKey=${MOMO_SECRET_KEY}
momo.partnerCode=${MOMO_PARTNER_CODE}

# ================= VNPAY PAYMENT =================
## Sandbox
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction


## Callback
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:4200/menu
vnpay.ipnUrl=https://abc.ngrok-free.app/api/vnpay/ipn

## Version
vnpay.version=2.1.0
vnpay.command=pay
vnpay.currCode=VND
vnpay.locale=vn
vnpay.orderType=other


# ================= CALLBACK =================
momo.redirectUrl=${MOMO_REDIRECT_URL}
momo.ipnUrl=${MOMO_IPN_URL}


logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG
logging.level.org.springframework.mail.javamail.JavaMailSenderImpl=DEBUG
logging.level.org.springframework.mail.javamail.SMTPTransport=DEBUG

# ================= GEMINI/GROQ =================
groq.api-key=${GROQ_API_KEY}

# ================= SERVER =================
server.port=${PORT:8080}
